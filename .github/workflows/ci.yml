name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The dashboard's `vite build` strips types without checking them, so
      # without this step a type error in dashboard/ would pass CI. `pnpm lint`
      # runs eslint over src/ and svelte-check over the dashboard package.
      - name: Lint and typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The pnpm 12 bump (#112) passed every check here and still broke the
      # image: corepack in node:24-alpine could not launch pnpm 12 at all.
      # The deps stage is the cheapest layer that exercises corepack and the
      # workspace install; the later stages are covered by the steps above.
      - name: Build Docker deps stage
        run: docker build --target deps .

      # Gates the automerged Renovate bump of the Dockerfile pin: the step
      # above stops at the deps stage, so a Codex CLI that fails to run would
      # otherwise reach main unverified and only break the publish job.
      - name: Smoke-test pinned Codex CLI
        run: |
          version=$(sed -n 's|.*@openai/codex@\([0-9.]*\).*|\1|p' Dockerfile)
          test -n "$version"
          npm install -g "@openai/codex@$version"
          codex --version
          # The flags src/codex/codex.service.ts:45-62 builds its argv from.
          for flag in --model --sandbox --json --output-last-message; do
            codex exec --help | grep -q -- "$flag" || {
              echo "::error::codex exec dropped $flag"; exit 1; }
          done
