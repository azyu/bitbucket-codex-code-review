packages:
  - "."
  - "dashboard"

# pnpm 12 no longer reads the "pnpm" field in package.json, so the multer
# advisory override from #109 has to live here or it is silently dropped
# (the install still succeeds and multer resolves back to 2.2.0).
overrides:
  multer: ^2.3.0

# pnpm 10 only warned about these four; pnpm 12 fails the install until each
# one is answered. false keeps the behavior we already ship: none of them are
# built, and every one of them resolves a prebuilt binary at runtime.
allowBuilds:
  '@parcel/watcher': false
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: false

# Hold new releases for two days before they may enter the lockfile, matched
# by minimumReleaseAge in renovate.json so Renovate never opens a PR pnpm
# would reject. Setting this explicitly also turns minimumReleaseAgeStrict on,
# so a fresh version fails the install instead of being excluded silently.
minimumReleaseAge: 2880
